<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SkillDrills">
  <!-- Flat single-colour mark. No gradient, no blur halo: the old logo stacked a
       blue-to-purple gradient, a 2px stroke of a second gradient, eight strokes
       of reticle and four diagonals, which turned to mush below about 32px. -->
  <rect width="64" height="64" rx="14" fill="#2563EB"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round">
    <circle cx="32" cy="32" r="13"/>
    <path d="M32 6.5V15"/>
    <path d="M32 49V57.5"/>
    <path d="M6.5 32H15"/>
    <path d="M49 32H57.5"/>
  </g>
  <circle cx="32" cy="32" r="4.5" fill="#FFFFFF"/>
</svg>
